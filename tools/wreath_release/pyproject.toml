[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ritualb2b-wreath-release"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["aiogram==3.27.0", "Pillow>=10", "requests>=2.31", "google-auth>=2"]

[tool.setuptools]
packages = ["wreath_release"]
package-dir = { wreath_release = "." }
